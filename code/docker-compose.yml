name: ssdm-benchmark

services:
  kafka:
    image: apache/kafka:3.9.1
    cpus: "${KAFKA_CPUS:-2}"
    mem_limit: "${KAFKA_MEMORY:-2g}"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      CLUSTER_ID: O94qfF0pQ4-lNvW65-IeRg
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_BROKER_SESSION_TIMEOUT_MS: "${KAFKA_BROKER_SESSION_TIMEOUT_MS:-9000}"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms768m -Xmx768m"
    volumes:
      - kafka_replay_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  kafka_replay_data:
