name: ssdm-benchmark

x-flink: &flink
  image: ssdm-flink:1.20.0-python
  build:
    context: ./Pipeline
    dockerfile_inline: |
      FROM flink:1.20.0-scala_2.12-java17
      USER root
      RUN apt-get update \
          && apt-get install -y --no-install-recommends python3 python3-venv tzdata \
          && rm -rf /var/lib/apt/lists/* \
          && python3 -m venv /opt/flink-python
      ENV PATH="/opt/flink-python/bin:$${PATH}"
      RUN pip install --no-cache-dir apache-flink==1.20.0 setuptools==75.8.2
      COPY jars/flink-sql-connector-kafka-3.3.0-1.20.jar /opt/flink/lib/
      COPY *.py /opt/ssdm/Pipeline/
      RUN cd /opt/ssdm/Pipeline && python -m zipfile -c /opt/ssdm/pipeline.zip *.py
      USER flink

services:
  kafka:
    image: apache/kafka:3.9.1
    cpus: "${KAFKA_CPUS:-2}"
    mem_limit: "${KAFKA_MEMORY:-2g}"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      CLUSTER_ID: O94qfF0pQ4-lNvW65-IeRg
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms768m -Xmx768m"
    volumes:
      - kafka_replay_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --list --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  flink-jobmanager:
    <<: *flink
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.bind-host: 0.0.0.0
        jobmanager.memory.process.size: 1600m
        rest.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
        metrics.fetcher.update-interval: 1000

  flink-taskmanager:
    <<: *flink
    command: taskmanager
    depends_on:
      - flink-jobmanager
    cpus: "${FLINK_CPUS:-1}"
    mem_limit: "${FLINK_CONTAINER_MEMORY:-4g}"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.bind-host: 0.0.0.0
        taskmanager.host: flink-taskmanager
        metrics.system-resource: true
        taskmanager.memory.process.size: ${FLINK_PROCESS_MEMORY:-2048m}
        taskmanager.numberOfTaskSlots: ${FLINK_CPUS:-1}
        taskmanager.cpu.cores: ${FLINK_CPUS:-1}
        taskmanager.memory.managed.fraction: 0.4
        python.executable: /opt/flink-python/bin/python

volumes:
  kafka_replay_data:
